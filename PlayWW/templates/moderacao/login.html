<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moderação — Acesso</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --surface: #0f0f1a;
    --border: #1e2035;
    --accent: #e8c84a;
    --accent-dim: #8a7530;
    --red: #e84a4a;
    --text: #c8cce8;
    --text-dim: #5a5e7a;
    --mono: 'Share Tech Mono', monospace;
    --display: 'Orbitron', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* grade de fundo */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(232,200,74,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(232,200,74,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .card {
    width: 100%;
    max-width: 400px;
    padding: 48px 40px;
    border: 1px solid var(--border);
    background: var(--surface);
    position: relative;
    animation: fadeUp .4s ease both;
  }

  /* canto decorativo */
  .card::before, .card::after {
    content: '';
    position: absolute;
    width: 12px; height: 12px;
    border-color: var(--accent);
    border-style: solid;
  }
  .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  .tag {
    font-size: 10px;
    letter-spacing: .2em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .tag::before {
    content: '';
    display: inline-block;
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: pulse 2s infinite;
  }

  h1 {
    font-family: var(--display);
    font-size: 20px;
    font-weight: 700;
    letter-spacing: .05em;
    color: #fff;
    margin-bottom: 8px;
  }

  .sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-bottom: 36px;
  }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: .15em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  input[type="password"] {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 16px;
    letter-spacing: .1em;
    outline: none;
    transition: border-color .2s;
  }
  input[type="password"]:focus {
    border-color: var(--accent-dim);
  }

  .erro {
    margin-top: 12px;
    padding: 10px 14px;
    background: rgba(232,74,74,.08);
    border-left: 3px solid var(--red);
    font-size: 12px;
    color: var(--red);
  }

  button {
    margin-top: 24px;
    width: 100%;
    padding: 14px;
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--display);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .15em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .2s, color .2s;
  }
  button:hover {
    background: var(--accent);
    color: var(--bg);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: .3; }
  }
</style>
</head>
<body>
<div class="card">
  <div class="tag">Sistema de Moderação</div>
  <h1>Acesso Restrito</h1>
  <p class="sub">Painel de revisão de votos suspeitos</p>

  <form method="POST">
    {% csrf_token %}
    <label for="senha">Senha</label>
    <input type="password" id="senha" name="senha" autocomplete="current-password" autofocus>
    {% if erro %}
      <div class="erro">{{ erro }}</div>
    {% endif %}
    <button type="submit">Entrar →</button>
  </form>
</div>
</body>
</html>

{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/page_by.css' %}">
    <title>{% block titulo %}{% endblock titulo %}</title>
    {% block links %}{% endblock links %}
</head>
<body>
    <style>
        .create_by{
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            margin-left: auto;
            margin-right: auto;
            width: fit-content;
            min-width: 200px;
            text-align: center;
            font-size: 0.8em;
        }
    </style>

    {% block site %}
    {% endblock site %}

    {% block page_by%}
    {% endblock page_by %}
</body>
</html>
